    <style>
        .initial-loader {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            font-family: sans-serif;
            color: rgba(0, 0, 0, .4);
        }

        .initial-loader__content {
            text-align: center;
        }

        .initial-loader svg {
            --wave-duration: 2.6s;
            --wave-step: calc(var(--wave-duration) / 6);
            display: block;
            overflow: visible;
        }

        .initial-loader path:nth-child(7), .initial-loader path:nth-child(8),
        .initial-loader path:nth-child(9), .initial-loader path:nth-child(10),
        .initial-loader path:nth-child(11), .initial-loader path:nth-child(12) {
            transform-origin: 12px 12px;
            transform-box: view-box;
            animation: initial-loader-wave var(--wave-duration) ease-out infinite;
        }

        .initial-loader path:nth-child(1), .initial-loader path:nth-child(2),
        .initial-loader path:nth-child(3), .initial-loader path:nth-child(4),
        .initial-loader path:nth-child(5), .initial-loader path:nth-child(6) {
            transform-origin: 12px 12px;
            transform-box: view-box;
            animation: initial-loader-wave-in var(--wave-duration) ease-out infinite;
        }

        .initial-loader path:nth-child(7), .initial-loader path:nth-child(1) { animation-delay: 0s; }
        .initial-loader path:nth-child(8), .initial-loader path:nth-child(2) { animation-delay: calc(var(--wave-step) * 1); }
        .initial-loader path:nth-child(9), .initial-loader path:nth-child(3) { animation-delay: calc(var(--wave-step) * 2); }
        .initial-loader path:nth-child(10), .initial-loader path:nth-child(4) { animation-delay: calc(var(--wave-step) * 3); }
        .initial-loader path:nth-child(11), .initial-loader path:nth-child(5) { animation-delay: calc(var(--wave-step) * 4); }
        .initial-loader path:nth-child(12), .initial-loader path:nth-child(6) { animation-delay: calc(var(--wave-step) * 5); }

        .initial-loader p {
            margin: .75em;
            padding-left: 1em;
            text-transform: uppercase;
        }

        @keyframes initial-loader-wave {
            0%, 50%, 100% { transform: scale(1) rotate3d(1, 1, 0, 0) rotate(0); opacity: 1; }
            25% { transform: scale(1.06) rotate3d(1, 1, 0, 15deg) rotate(1deg); opacity: .9; }
            75% { transform: scale(1.06) rotate3d(1, 1, 0, 15deg) rotate(-1deg); opacity: .85; }
        }

        @keyframes initial-loader-wave-in {
            0%, 50%, 100% { transform: scale(1) rotate3d(1, 1, 0, 0deg) rotate(0); opacity: 1; }
            25% { transform: scale(.996) rotate3d(1, 1, 0, -15deg) rotate(-2deg); opacity: .25; }
            75% { transform: scale(.996) rotate3d(1, 1, 0, 15deg) rotate(2deg); opacity: .35; }
        }
    </style>
