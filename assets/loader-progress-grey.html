<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Progress Loader</title>

    <style>
    :root {
        --inactive-segment: rgba(0, 0, 0, .06);
    }

    body {
        margin: 0;
        font-family: sans-serif;
        color: rgba(0, 0, 0, .4);
    }

    main {
        display: grid;
        justify-items: center;
        padding: 60px 24px 0 24px;
    }

    .loader-card {
        width: min(100%, 320px);
        box-sizing: border-box;
        overflow: hidden;
        border: 1px solid rgba(0, 0, 0, .12);
        border-radius: 0 0 36px 36px;
    }

    .loader-card__toolbar {
        display: flex;
        align-items: center;
        height: 56px;
        padding: 0 16px;
        border-bottom: 1px solid rgba(0, 0, 0, .12);
    }

    .loader-card__content {
        padding: 40px;
        text-align: center;
    }

    .progress-loader {
        position: relative;
        display: inline-grid;
        place-items: center;
        width: 96px;
        height: 96px;
    }

    .progress-loader svg {
        width: 100%;
        height: 100%;
        overflow: visible;
    }

    .progress-loader path {
        transform-box: fill-box;
        transform-origin: center;
        transform: scale(.93);
    }

    .progress-loader path.is-active {
        transform: scale(1);
    }

    .progress-loader__value {
        position: absolute;
        color: rgba(0, 0, 0, .3);
        font-size: 20px;
        font-weight: lighter;
        font-variant-numeric: tabular-nums;
    }

    .loader-card__content p {
        margin: .75em;
        padding-left: 1em;
        font-size: .875rem;
        letter-spacing: .08em;
        text-transform: uppercase;
    }

    @media (prefers-reduced-motion: reduce) {
        .progress-loader path {
            transform: scale(1);
        }
    }

    path {
        fill-opacity: .5;
    }
    </style>
</head>
<body>
<main>
    <section class="loader-card" aria-label="Loading data">
        <div class="loader-card__toolbar">
            <span>Progress Loading Concept</span>
        </div>
        <div class="loader-card__content">
            <div class="progress-loader" role="progressbar" aria-label="Loading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24" aria-hidden="true">
                    <g>
                        <path d="m3.34 7 4 2.31L12 6.618z" fill="#a8a8a8"/><path d="M12 2v4.619l4.66 2.69Z" fill="#b4b4b4"/><path d="M16.66 14.69V9.31l4-2.31z" fill="#9c9c9c"/><path d="m20.66 17-4-2.31L12 17.382Z" fill="#6b6b6b"/><path d="M12 22v-4.619l-4.66-2.69Z" fill="#58585a"/><path d="m7.34 14.69-4 2.31 4-7.69z" fill="#8d8d8d"/><path d="M3.34 7 12 6.62V2Z" fill="#d7d7d7"/><path d="m12 2 4.66 7.31 4-2.31Z" fill="#d3d3d3"/><path d="m16.66 14.69 4 2.31V7z" fill="#bababa"/><path d="M12 17.381v4.62l8.66-5z" fill="#878787"/><path d="M7.34 14.69 12 22l-8.66-5Z" fill="#6d6d6d"/><path d="M7.34 9.31 3.34 7v10z" fill="#c4c4c4"/>
                    </g>
                </svg>
                <output class="progress-loader__value" aria-live="polite">0%</output>
            </div>
            <p>Loading&hellip;</p>
        </div>
    </section>
</main>

<script>
(() => {
    const loader = document.querySelector('.progress-loader');
    const value = loader.querySelector('.progress-loader__value');
    const paths = [...loader.querySelectorAll('path')];
    const segments = [paths[1], paths[7], paths[2], paths[8], paths[3], paths[9], paths[4], paths[10], paths[5], paths[11], paths[0], paths[6]];
    const duration = 3000;
    const totalWeight = 18;
    const inactiveFill = 'rgba(0, 0, 0, .09)';
    const activeFills = new Map(paths.map((path) => [path, path.getAttribute('fill')]));

    function setProgress(progress) {
        let remainingWeight = (progress / 100) * totalWeight;

        for (let index = 0; index < segments.length; index += 1) {
            const segment = segments[index];
            const weight = index % 2 === 0 ? 1 : 2;
            const amount = Math.min(1, Math.max(0, remainingWeight / weight));
            segment.style.fill = amount === 0
                ? inactiveFill
                : `color-mix(in srgb, ${inactiveFill} ${(1 - amount) * 100}%, ${activeFills.get(segment)} ${amount * 100}%)`;
            segment.classList.toggle('is-active', amount > 0);
            remainingWeight -= weight;
        }

        const roundedProgress = Math.round(progress);
        loader.setAttribute('aria-valuenow', roundedProgress);
        value.textContent = `${roundedProgress}`;
    }

    if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
        setProgress(100);
        return;
    }

    let startTime;
    function animate(now) {
        startTime ??= now;
        const progress = ((now - startTime) % duration) / duration * 100;
        setProgress(progress);
        requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
})();
</script>
</body>
</html>
