    .group-heading:focus-visible { outline: 2px solid #2563eb; outline-offset: .2rem; }

    .swatches { display: grid; gap: .75rem; width: 100%; }

    .swatch.is-tailwind .swatch-color { border: 3px solid rgba(0, 0, 0, .87); }
    .swatch-color::before { position: absolute; inset: 0; content: ""; background: var(--swatch-color); }
    .swatch-label { position: relative; display: grid; gap: .16rem; max-width: 100%; padding: .1rem .2rem; color: var(--swatch-label-color); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; line-height: 1; text-align: center; text-shadow: 0 1px 1px color-mix(in srgb, var(--swatch-label-color) 28%, transparent); }
    .swatch-scale-name { overflow: hidden; font-size: .86rem; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .swatch-match-name { overflow: hidden; font-size: .7rem; font-weight: 400; text-overflow: ellipsis; white-space: nowrap; }
    .swatch.is-known-match .swatch-match-name { font-weight: 800; }
    .swatch-match-percent { font-size: .56rem; font-weight: 400; }
    .swatch-details { display: flex; flex: 1; min-width: 0; flex-direction: column; justify-content: start; padding: .2rem .65rem; }
    code { display: block; overflow-wrap: anywhere; color: #252525; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .78rem; font-weight: 600; }

    .match { margin-top: .2rem; color: #555; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .7rem; line-height: 1.35; overflow-wrap: anywhere; }
    .match.known { color: #252525; font-weight: 800; }
    @media (max-width: 36rem) { main { padding: 1rem; } }

    };

    const formatCssOklch = value => {
        const color = toOklch(value);
        if (!color) return value;

        const alpha = color.alpha ?? 1;
        const hue = color.h === undefined || Number.isNaN(color.h) ? 'none' : color.h.toFixed(1);
        const alphaSuffix = alpha < 1 ? ` / ${alpha.toFixed(2)}` : '';
        return `oklch(${(color.l * 100).toFixed(1)}% ${color.c.toFixed(3)} ${hue}${alphaSuffix})`;
    };

    const copyToClipboard = async text => {
        if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(text);
            return;
        }

        const input = document.createElement('textarea');
        input.value = text;
        input.style.position = 'fixed';
        input.style.opacity = '0';
        document.body.append(input);
        input.select();
        const copied = document.execCommand('copy');
        input.remove();
        if (!copied) throw new Error('Clipboard access is unavailable.');
    };

    for (const sheet of document.styleSheets) {
        for (const rule of sheet.cssRules) {
            if (rule.selectorText === ':root') {
                for (const property of rule.style) {
                    if (property.startsWith('--')) declared.add(property);
                }
            }
        }
    }

    const appendSwatch = (swatches, name, value, options = {}) => {
        const { isTailwind = false, scaleName = null, match = null } = options;
        const exactMatch = match?.exact;
        const closestMatch = exactMatch ? null : match?.closest;
        const matchingScaleName = exactMatch?.scaleName ?? closestMatch?.candidate.scaleName;
        const matchPercentage = closestMatch
            ? `${matchPercent(closestMatch.distance).toFixed(1)}%`
            : null;
        const swatchLabel = [
            scaleName && `<span class="swatch-scale-name">${scaleName}</span>`,
            matchingScaleName && `<span class="swatch-match-name">${matchingScaleName}</span>`,
            matchPercentage && `<span class="swatch-match-percent">${matchPercentage}</span>`
        ].filter(Boolean).join('');
        const card = document.createElement('article');
        card.className = `swatch${isTailwind ? ' is-tailwind' : ''}${exactMatch ? ' is-known-match' : ''}`;
        card.innerHTML = `<div class="swatch-color">${swatchLabel ? `<div class="swatch-label">${swatchLabel}</div>` : ''}</div><div class="swatch-details"><code></code><div class="value"></div><div class="oklch-value"></div></div>`;
        card.style.setProperty('--swatch-color', value.startsWith('--') ? `var(${value})` : value);
        card.style.setProperty('--swatch-label-color', swatchLabelColor(value));
        card.querySelector('code').textContent = name;
        card.querySelector('.value').textContent = value;
        card.querySelector('.oklch-value').textContent = formatOklch(value);
        swatches.append(card);
    };

    const appendGroupedSwatches = (container, items, append) => {
        const groups = new Map();
        for (const item of items) {
            const key = item.name.replace(/-[^-]+$/, '');
            groups.set(key, [...(groups.get(key) ?? []), item]);
        }

        for (const itemsInGroup of groups.values()) {
            const group = document.createElement('div');
            group.className = 'swatch-group';
            const swatches = document.createElement('div');
            swatches.className = 'swatches';
            for (const item of itemsInGroup) append(swatches, item);
            group.append(swatches);
            container.append(group);
        }
    };

    const appendSection = (label, items, addSwatches) => {
        const section = document.createElement('section');
        section.className = 'group';
        const css = `:root {\n${items.map(({ name, value }) => `  ${name}: ${formatCssOklch(value)};`).join('\n')}\n}`;
        section.innerHTML = `<button class="group-heading" type="button" title="Copy CSS variables" aria-label="Copy ${label} CSS variables"><h2>${label}</h2><span class="count">${items.length} colors</span></button><div class="swatch-groups"></div>`;
        const heading = section.querySelector('.group-heading');
        heading.addEventListener('click', async () => {
            try {
                await copyToClipboard(css);
                heading.title = 'Copied CSS variables';
            } catch {
                heading.title = 'Unable to copy CSS variables';
            }
        });
        addSwatches(section.querySelector('.swatch-groups'));
        report.append(section);
    };

    const groups = new Map();
    for (const name of [...declared].sort()) {
        const group = name.slice(2).split('-')[0];
        groups.set(group, [...(groups.get(group) ?? []), name]);
    }
    for (const [group, names] of [...groups].sort(([a], [b]) => {
        const aOrder = groupOrder.indexOf(a);
        const bOrder = groupOrder.indexOf(b);
        return (aOrder < 0 ? Number.MAX_SAFE_INTEGER : aOrder) - (bOrder < 0 ? Number.MAX_SAFE_INTEGER : bOrder);
    })) {
        const items = names.map(name => ({ name, value: rootStyles.getPropertyValue(name).trim() }));
        appendSection(groupLabels[group] ?? group, items, swatchGroups => {
            appendGroupedSwatches(swatchGroups, items, (swatches, { name, value }) => {
                const match = findPaletteMatch(value);
                appendSwatch(swatches, name, value, { isTailwind: Boolean(match.exact), match });
            });
        });
    }

    appendSection('Custom', customPalette.map(color => ({ name: `--${color.name}`, value: color.value })), swatchGroups => {
        appendGroupedSwatches(swatchGroups, customPalette, (swatches, color) => {
            const match = findPaletteMatch(color.value, tailwindPalette);
            appendSwatch(swatches, `--${color.name}`, color.value, { scaleName: color.scaleName, match });
        });
    });

    appendSection('Tailwind', tailwindPalette.map(color => ({ name: `--color-${color.name}`, value: color.value })), swatchGroups => {
        appendGroupedSwatches(swatchGroups, tailwindPalette, (swatches, color) => {
            appendSwatch(swatches, `--color-${color.name}`, color.value, { isTailwind: true, scaleName: color.scaleName });
        });
    });
})();
</script>
</body>
</html>
