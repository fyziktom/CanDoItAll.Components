<!doctype html>
<html lang="en" data-cad-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Semantic Tailwind demo</title>
    <script>
        document.documentElement.dataset.cadTheme = localStorage.getItem('semantic-demo-theme') === 'dark' ? 'dark' : 'light';
    </script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="./output-test.css">
</head>
<body>
    <div id="app"></div>

    <template id="button-row-template">
        <section class="demo-card space-y-3" :class="`demo-role--${role.key}`">
            <div class="mb-4 flex items-start justify-between gap-4">
                <div>
                    <h2 class="text-lg font-bold text-chrome-900">{{ role.name }}</h2>
                    <p class="mt-1 text-sm text-chrome-600">{{ role.description }}</p>
                </div>
                <span class="rounded-full bg-chrome-100 px-2.5 py-1 text-xs font-medium text-chrome-600">semantic role</span>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <div><button class="demo-button demo-button--solid demo-button--pill demo-button--compact" type="button"><span class="icon text-2xl" aria-hidden="true">search</span></button></div>
                <div><button class="demo-button demo-button--outline demo-button--compact" type="button"><span class="icon text-md" aria-hidden="true">search</span></button></div>
                <div><button class="demo-button demo-button--solid demo-button--pill min-w-20" type="button">Solid</button></div>
                <div><button class="demo-button demo-button--tonal demo-button--compact" type="button">Tonal</button></div>
                <div><button class="demo-button demo-button--outline demo-button--dense" type="button">Outlined</button></div>
                <div><button class="demo-button demo-button--plain demo-button--dense" type="button">Plain</button></div>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <div><button class="demo-button demo-button--solid demo-button--rounded" type="button" disabled>Disabled</button></div>
                <div><button class="demo-button demo-button--tonal" type="button" disabled>Disabled</button></div>
                <div><button class="demo-button demo-button--outline" type="button" disabled>Disabled</button></div>
                <div><button class="demo-button demo-button--plain" type="button" disabled>Disabled</button></div>
            </div>
        </section>
    </template>

    <template id="alert-template">
        <article class="demo-alert" :class="`demo-alert--${alert.key}`">
            <div class="flex gap-3 items-center">
                <span class="icon icon--filled min-w-8 text-3xl" aria-hidden="true">{{ alert.icon }}</span>
                <div>
                    <h3 class="font-bold">{{ alert.title }}</h3>
                    <p class="mt-1 text-sm leading-6 opacity-80">{{ alert.message }}</p>
                </div>
            </div>
        </article>
    </template>

    <template id="app-template">
        <main class="demo-page">
            <div class="demo-shell">
                <header class="mb-8 border-b border-chrome-200 pb-8">
                    <p class="text-sm font-semibold uppercase tracking-widest text-primary-600">Tailwind semantic roles</p>
                    <h1 class="mt-2 text-3xl font-bold tracking-tight text-chrome-950">Action and feedback palette</h1>
                    <p class="mt-3 max-w-3xl text-chrome-600">The palette names describe intent. Chrome stays neutral for the page, cards, separators, and metadata; actions and feedback use primary, info, success, warn, and danger.</p>
                </header>

                <div class="mb-6 flex justify-end">
                    <button class="demo-theme-toggle" type="button" :aria-pressed="darkMode" @click="toggleTheme">
                        <span class="icon" aria-hidden="true">{{ darkMode ? 'light_mode' : 'dark_mode' }}</span>
                        {{ darkMode ? 'Light theme' : 'Dark theme' }}
                    </button>
                </div>

                <section aria-labelledby="buttons-heading">
                    <div class="mb-4">
                        <h2 id="buttons-heading" class="text-xl font-bold text-chrome-900">Button treatments</h2>
                        <p class="mt-1 text-sm text-chrome-600">The same four treatments work for every semantic role.</p>
                    </div>
                    <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
                        <button-row v-for="role in roles" :key="role.key" :role="role"></button-row>
                    </div>
                </section>

                <section class="mt-10" aria-labelledby="alerts-heading">
                    <div class="mb-4">
                        <h2 id="alerts-heading" class="text-xl font-bold text-chrome-900">Feedback</h2>
                        <p class="mt-1 text-sm text-chrome-600">Alerts use the same role token family without borrowing chrome colors.</p>
                    </div>
                    <div class="grid gap-4 md:grid-cols-2">
                        <demo-alert v-for="alert in alerts" :key="alert.key" :alert="alert"></demo-alert>
                    </div>
                </section>

                <section class="mt-10" aria-labelledby="padding-heading">
                    <div class="mb-4">
                        <h2 id="padding-heading" class="text-xl font-bold text-chrome-900">Layout flexibility</h2>
                        <p class="mt-1 text-sm text-chrome-600">The component owns its themed surface; page markup chooses the spacing appropriate to its layout.</p>
                    </div>
                    <div class="grid gap-4 md:grid-cols-3">
                        <article class="demo-card">
                            <p class="text-sm font-semibold text-chrome-900">Default padding</p>
                            <p class="mt-2 text-sm leading-6 text-chrome-600">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Integer posuere erat a ante venenatis dapibus.</p>
                        </article>
                        <article class="demo-card p-8">
                            <p class="text-sm font-semibold text-chrome-900">Larger padding</p>
                            <p class="mt-2 text-sm leading-6 text-chrome-600">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Integer posuere erat a ante venenatis dapibus.</p>
                        </article>
                        <article class="demo-card p-12">
                            <p class="text-sm font-semibold text-chrome-900">Large padding</p>
                            <p class="mt-2 text-sm leading-6 text-chrome-600">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Integer posuere erat a ante venenatis dapibus.</p>
                        </article>
                    </div>
                </section>

                <section class="mt-10" aria-labelledby="forms-heading">
                    <div class="mb-4">
                        <h2 id="forms-heading" class="text-xl font-bold text-chrome-900">Semantic form controls</h2>
                        <p class="mt-1 text-sm text-chrome-600">The forms plugin supplies the opt-in reset; CAD classes supply the theme-aware surface, border, text, and focus treatment.</p>
                    </div>
                    <div class="grid gap-4 md:grid-cols-2">
                        <form class="demo-card space-y-4" @submit.prevent>
                            <div>
                                <label class="mb-1.5 block text-sm font-semibold text-chrome-900" for="outlined-email">Outlined input</label>
                                <input id="outlined-email" class="form-input cad-input cad-input--outlined" type="email" placeholder="you@example.com">
                            </div>
                            <div>
                                <label class="mb-1.5 block text-sm font-semibold text-chrome-900" for="outlined-role">Outlined select</label>
                                <select id="outlined-role" class="form-select cad-select cad-select--outlined">
                                    <option>Choose a role</option>
                                    <option>Designer</option>
                                    <option>Developer</option>
                                </select>
                            </div>
                            <div>
                                <label class="mb-1.5 block text-sm font-semibold text-chrome-700 cad-disabled" for="disabled-company">Disabled input</label>
                                <input id="disabled-company" class="form-input cad-input cad-input--outlined" type="text" value="CanDoItAll Components" disabled>
                            </div>
                            <label class="flex items-center gap-2 text-sm text-chrome-700">
                                <input class="form-checkbox cad-checkbox cad-checkbox--outlined" type="checkbox" checked>
                                Send product updates
                            </label>
                        </form>
                        <form class="demo-card space-y-4" @submit.prevent>
                            <div>
                                <label class="mb-1.5 block text-sm font-semibold text-chrome-900" for="filled-name">Filled input</label>
                                <input id="filled-name" class="form-input cad-input cad-input--filled" type="text" value="Ada Lovelace">
                            </div>
                            <div>
                                <label class="mb-1.5 block text-sm font-semibold text-chrome-900" for="filled-team">Filled select</label>
                                <select id="filled-team" class="form-select cad-select cad-select--filled">
                                    <option>Platform team</option>
                                    <option>Product team</option>
                                    <option>Design team</option>
                                </select>
                            </div>
                            <div>
                                <label class="mb-1.5 block text-sm font-semibold text-chrome-700 cad-disabled" for="disabled-company">Disabled input</label>
                                <input id="disabled-company" class="form-input cad-input cad-input--filled" type="text" value="CanDoItAll Components" disabled>
                            </div>
                            <label class="flex items-center gap-2 text-sm text-chrome-700">
                                <input class="form-checkbox cad-checkbox cad-checkbox--filled" type="checkbox">
                                Enable weekly summary
                            </label>
                        </form>
                    </div>
                </section>

                <section class="mt-10" aria-labelledby="semantic-swatches-heading">
                    <h2 id="semantic-swatches-heading" class="mb-4 text-xl font-bold text-chrome-900">Semantic
                        swatches</h2>

    <script>
        const { createApp } = Vue;

        createApp({
            template: '#app-template',
            components: {
                'button-row': { template: '#button-row-template', props: ['role'] },
                'demo-alert': { template: '#alert-template', props: ['alert'] }
            },
            data: () => ({
                darkMode: false,
                icons: ['menu', 'search', 'close', 'add', 'more_vert', 'home', 'settings', 'notifications', 'person', 'edit', 'delete', 'favorite'],
                semanticScaleNames: ['chrome', 'primary', 'secondary', 'tertiary', 'info', 'success', 'warn', 'danger'],
                semanticShades: [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950],
                roles: [
                    { key: 'primary', name: 'Primary', description: 'The default action in a workflow.' },
                    { key: 'secondary', name: 'Secondary', description: 'The secondary action in a workflow.' },
                    { key: 'tertiary', name: 'Tertiary', description: 'The tertiary action in a workflow.' },
                    { key: 'info', name: 'Info', description: 'Helpful or contextual actions.' },
                    { key: 'success', name: 'Success', description: 'Confirmation and positive outcomes.' },
                    { key: 'warn', name: 'Warning', description: 'Proceed with care or review needed.' },
                    { key: 'danger', name: 'Danger', description: 'Destructive or irreversible actions.' }
                ],
                alerts: [
                    { key: 'primary', icon: 'info', title: 'New information', message: 'A newer version of this template is available.' },
                    { key: 'secondary', icon: 'info', title: 'New information', message: 'A newer version of this template is available.' },
                    { key: 'tertiary', icon: 'info', title: 'New information', message: 'A newer version of this template is available.' },
                    { key: 'info', icon: 'info', title: 'New information', message: 'A newer version of this template is available.' },
                    { key: 'success', icon: 'check_circle', title: 'Changes saved', message: 'Your settings were saved successfully.' },
                    { key: 'warn', icon: 'warning', title: 'Review required', message: 'Two fields need attention before you can continue.' },
                    { key: 'danger', icon: 'error', title: 'Action failed', message: 'We could not complete the requested operation.' }
                ]
            }),
            mounted() {
                this.darkMode = document.documentElement.dataset.cadTheme === 'dark';
                window.addEventListener('keydown', ({key}) => {
                    if (key === 'd') this.toggleTheme();
                });
            },
            methods: {
                toggleTheme() {
                    this.darkMode = !this.darkMode;
                    const theme = this.darkMode ? 'dark' : 'light';
                    const root = document.documentElement;

                    root.classList.add('demo-theme-switching');
                    requestAnimationFrame(() => {
                        root.dataset.cadTheme = theme;
                        localStorage.setItem('semantic-demo-theme', theme);

                        requestAnimationFrame(() => {
                            root.classList.remove('demo-theme-switching');
                        });
                    });
                }
            }
        }).mount('#app');
    </script>
