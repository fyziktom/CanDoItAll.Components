<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loader</title>

    <style>
    svg {
        overflow: visible;
    }

    svg {
        --wave-duration: 2.6s;
        --wave-step: calc(var(--wave-duration) / 6);
    }

    path:nth-child(7), path:nth-child(8), path:nth-child(9),
    path:nth-child(10), path:nth-child(11), path:nth-child(12) {
        transform-origin: 12px 12px;
        transform-box: view-box;
        animation: wave var(--wave-duration) ease-out infinite;
    }

    path:nth-child(1), path:nth-child(2), path:nth-child(3),
    path:nth-child(4), path:nth-child(5), path:nth-child(6) {
        transform-origin: 12px 12px;
        transform-box: view-box;
        animation: wave-in var(--wave-duration) ease-out infinite;
    }

    path:nth-child(7),
    path:nth-child(1) {
        animation-delay: calc(var(--wave-step) * -5);
    }

    path:nth-child(8),
    path:nth-child(2) {
        animation-delay: calc(var(--wave-step) * -4);
    }

    path:nth-child(9),
    path:nth-child(3) {
        animation-delay: calc(var(--wave-step) * -3);
    }

    path:nth-child(10),
    path:nth-child(4) {
        animation-delay: calc(var(--wave-step) * -2);
    }

    path:nth-child(11),
    path:nth-child(5) {
        animation-delay: calc(var(--wave-step) * -1);
    }

    path:nth-child(12),
    path:nth-child(6) {
        animation-delay: calc(var(--wave-step) * 0);
    }

    @keyframes wave {
        0%, 50%, 100% {
            transform: scale(1) rotate3d(1, 1, 0, 0) rotate(0);
            opacity: 1;
        }
        25% {
            transform: scale(1.06) rotate3d(1, 1, 0, 15deg) rotate(1deg);
            opacity: .9;
        }
        75% {
            transform: scale(1.06) rotate3d(1, 1, 0, 15deg) rotate(-1deg);
            opacity: .85;
        }
    }

    @keyframes wave-in {
        0%, 50%, 100% {
            transform: scale(1) rotate3d(1, 1, 0, 0deg) rotate(0);
            opacity: 1;
        }
        25% {
            transform: scale(.996) rotate3d(1, 1, 0, -15deg) rotate(-2deg);
            opacity: 0.25;
        }
        75% {
            transform: scale(.996) rotate3d(1, 1, 0, 15deg) rotate(2deg);
            opacity: 0.35;
        }
    }

    body {
        text-align: center;
        font-family: sans-serif;
        color: rgba(0, 0, 0, .4);
        padding: 60px;
    }

    p {
        margin: .75em;
        padding-left: 1em;
        text-transform: uppercase;
    }
    </style>
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24">
