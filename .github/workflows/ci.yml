name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Tailwind/package-lock.json

      - name: Restore JavaScript tools
        run: |
          npm ci
          npm ci --prefix Tailwind

      - name: Build generated styles and verify component assets
        run: |
          npm run build:tailwind
          npm run assets:verify

      - name: Restore .NET dependencies
        run: dotnet restore CanDoItAll.Components.slnx --configfile NuGet.config

      - name: Build
        run: dotnet build CanDoItAll.Components.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test CanDoItAll.Components.slnx --configuration Release --no-build --no-restore

      - name: Pack
        run: powershell -ExecutionPolicy Bypass -File tools/deployment/nugets/Build-NuGets.ps1 -NoBuild -NoRestore

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/packages/**/*.nupkg
            artifacts/packages/**/*.snupkg
          if-no-files-found: error
